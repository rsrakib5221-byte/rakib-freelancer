<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.card{
background:#fff;
padding:15px;
margin:10px 0;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.2);
}
</style>
</head>
<body>

<h2>Withdraw Requests</h2>

<div id="list"></div>
<h2>Verification Requests</h2>

<div id="verificationList"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getFirestore,
  getDoc,
  collection,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

  import {
  getAuth
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  const firebaseConfig = {
  apiKey: "AIzaSyAaQIX6yMxjf6bkHD6HPSImNF3o7r0fZvo",
  authDomain: "rakib-freelancer.firebaseapp.com",
  databaseURL: "https://rakib-freelancer-default-rtdb.firebaseio.com",
  projectId: "rakib-freelancer",
  storageBucket: "rakib-freelancer.firebasestorage.app",
  messagingSenderId: "172744042815",
  appId: "1:172744042815:web:2b77927b0ecacf59d00b8a",
  measurementId: "G-FKFC3JM9XR"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
  const auth = getAuth(app);

const list = document.getElementById("list");

async function loadRequests() {
  list.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "withdraws"));

  querySnapshot.forEach((requestDoc) => {
    const d = requestDoc.data();
d.id = requestDoc.id;
    list.innerHTML += `
      <div class="card">
        <b>Amount:</b> ${d.amount}<br>
        <b>Method:</b> ${d.method}<br>
        <b>Number:</b> ${d.number}<br>
        <b>Status:</b> ${d.status}<br><br>

        <button onclick="approveRequest('${requestDoc.id}')">✅ Approve</button>
        <button onclick="rejectRequest('${requestDoc.id}')">❌ Reject</button>
        <button onclick="deleteRequest('${requestDoc.id}')">🗑 Delete</button>
      </div>
    `;
  });
}

window.approveRequest = async (id) => {
  try {
    const requestRef = doc(db, "withdraws", id);
const requestSnap = await getDoc(requestRef);

if (!requestSnap.exists()) return;

const request = requestSnap.data();

const userQuery = await getDocs(
  collection(db, "users")
);

let userDocId = "";

userQuery.forEach((u) => {
  if (u.data().email === request.email) {
    userDocId = u.id;
  }
});
    if (userDocId) {
  const userRef = doc(db, "users", userDocId);
  const userSnap = await getDoc(userRef);

  if (userSnap.exists()) {
    const balance = Number(userSnap.data().balance || 0);

    await updateDoc(userRef, {
      balance: balance - Number(request.amount)
    });
  }
    }
    await updateDoc(doc(db, "withdraws", id), {
      status: "Approved"
    });
    alert("Approved Successfully");
    loadRequests();
  } catch (e) {
    alert(e.message);
    console.error(e);
  }
};

window.rejectRequest = async (id) => {
  try {
    await updateDoc(doc(db, "withdraws", id), {
      status: "Rejected"
    });
    alert("Rejected Successfully");
    loadRequests();
  } catch (e) {
    alert(e.message);
    console.error(e);
  }
};
window.deleteRequest = async (id) => {
  await deleteDoc(doc(db, "withdraws", id));
  loadRequests();
};

loadRequests();
  const verificationList = document.getElementById("verificationList");

async function loadVerificationRequests() {
  verificationList.innerHTML = "";

  const snapshot = await getDocs(collection(db, "verificationRequests"));

  snapshot.forEach((docSnap) => {
    const d = docSnap.data();

    verificationList.innerHTML += `
      <div class="card">
        <b>Name:</b> ${d.name}<br>
        <b>Email:</b> ${d.email}<br>
        <b>Method:</b> ${d.method}<br>
        <b>Phone:</b> ${d.phone}<br>
        <b>TrxID:</b> ${d.trxid}<br>
        <b>Status:</b> ${d.status}<br><br>

        <button onclick="approveVerification('${docSnap.id}','${d.email}')">✅ Approve</button>
      </div>
    `;
  });
}
  window.approveVerification = async (id, email) => {
  try {
    const userQuery = await getDocs(collection(db, "users"));

    let userDocId = "";

    userQuery.forEach((u) => {
      if (u.data().email === email) {
        userDocId = u.id;
      }
    });

    if (userDocId) {
      await updateDoc(doc(db, "users", userDocId), {
        verified: true
      });
    }

    await updateDoc(doc(db, "verificationRequests", id), {
      status: "Approved"
    });

    alert("Verification Approved Successfully");
    loadVerificationRequests();

  } catch (e) {
    alert(e.message);
    console.error(e);
  }
};

loadVerificationRequests();
</script>

</body>
</html>
