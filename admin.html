<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.card{
background:#fff;
padding:15px;
margin:10px 0;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.2);
}
</style>
</head>
<body>

<h2>Withdraw Requests</h2>

<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAaQIX6yMxjf6bkHD6HPSImNF3o7r0fZvo",
  authDomain: "rakib-freelancer.firebaseapp.com",
  projectId: "rakib-freelancer",
  storageBucket: "rakib-freelancer.firebasestorage.app",
  messagingSenderId: "172744042815",
  appId: "1:172744042815:web:2b77927b0ecacf59d00b8a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("list");

async function loadRequests() {
  list.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "withdraws"));

  querySnapshot.forEach((requestDoc) => {
    const d = requestDoc.data();

    list.innerHTML += `
      <div class="card">
        <b>Amount:</b> ${d.amount}<br>
        <b>Method:</b> ${d.method}<br>
        <b>Number:</b> ${d.number}<br>
        <b>Status:</b> ${d.status}<br><br>

        <button onclick="approveRequest('${requestDoc.id}')">✅ Approve</button>
        <button onclick="rejectRequest('${requestDoc.id}')">❌ Reject</button>
        <button onclick="deleteRequest('${requestDoc.id}')">🗑 Delete</button>
      </div>
    `;
  });
}

window.approveRequest = async (id) => {
  try {
    await updateDoc(doc(db, "withdraws", id), {
      status: "Approved"
    });
    alert("Approved Successfully");
    loadRequests();
  } catch (e) {
    alert(e.message);
    console.error(e);
  }
};

window.rejectRequest = async (id) => {
  try {
    await updateDoc(doc(db, "withdraws", id), {
      status: "Rejected"
    });
    alert("Rejected Successfully");
    loadRequests();
  } catch (e) {
    alert(e.message);
    console.error(e);
  }
};
window.deleteRequest = async (id) => {
  await deleteDoc(doc(db, "withdraws", id));
  loadRequests();
};

loadRequests();
</script>

</body>
</html>
