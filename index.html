<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakib Freelancer - Login & Register</title>

<style>
  body{
    background:linear-gradient(135deg,#1877f2,#00c6ff);
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.register-box{
    width:350px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}

.register-box h2{
    color:#1877f2;
    font-size:28px;
    margin-bottom:5px;
}

.register-box p{
    color:#777;
}


.register-box input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    box-sizing:border-box;
    outline:none;
}


.register-box input:focus{
    border-color:#1877f2;
}


.register-box button{

    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:16px;
    cursor:pointer;

}


.register-box button:hover{

    background:#145dbf;

}


#recaptcha-container{

    margin:10px 0;

}


#msg{

    margin-top:15px;
    font-weight:bold;

}

</style>

</body>
</html>
