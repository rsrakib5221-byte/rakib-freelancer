<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakib Freelancer - Login & Register</title>

<style>
  body{
    background:linear-gradient(135deg,#1877f2,#00c6ff);
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.register-box{
    width:350px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}

.register-box h2{
    color:#1877f2;
    font-size:28px;
    margin-bottom:5px;
}

.register-box p{
    color:#777;
}


.register-box input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    box-sizing:border-box;
    outline:none;
}


.register-box input:focus{
    border-color:#1877f2;
}


.register-box button{

    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:16px;
    cursor:pointer;

}


.register-box button:hover{

    background:#145dbf;

}


#recaptcha-container{

    margin:10px 0;

}


#msg{

    margin-top:15px;
    font-weight:bold;

}

</style>

<div class="register-box">

<h2>Rakib Freelancer</h2>

<p>Create New Account</p>

<input 
type="text" 
id="phone" 
placeholder="📱 Phone Number (+8801XXXXXXXXX)"
>

<div id="recaptcha-container"></div>

<button id="sendBtn" onclick="sendOTP()">
Send OTP
</button>
<input 
type="text" 
id="otp" 
placeholder="🔐 Enter OTP"
>


<input 
type="text" 
id="referral" 
placeholder="🎁 Referral Code"
>


<button onclick="verifyOTP()">
Verify & Register
</button>


<p id="msg"></p>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithPhoneNumber,
  RecaptchaVerifier,
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig = 
apiKey: "AIzaSyAaQIX6yMxjf6bkHD6HPSImNF3o7r0fZvo",
authDomain: "rakib-freelancer.firebaseapp.com",
projectId: "rakib-freelancer",
storageBucket: "rakib-freelancer.firebasestorage.app",
messagingSenderId: "172744042815",
appId: "1:172744042815:web:2b77927b0ecacf59d00b8a",
measurementId: "G-FKFC3JM9XR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", {
  size: "normal",
  callback: () => {
    console.log("reCAPTCHA verified");
  }
});

const db = getFirestore(app);
let confirmationResult;



window.sendOTP = async function(){
alert("Send OTP Clicked");
  
const phone = document.getElementById("phone").value.trim();


if(phone.length !== 11){

document.getElementById("msg").innerHTML =
"❌ সঠিক ফোন নাম্বার দিন";

return;

}


try{


window.recaptchaVerifier = new RecaptchaVerifier(
auth,
"recaptcha-container",
{
size:"normal"
}
);


confirmationResult = await signInWithPhoneNumber(
auth,
"+88"+phone,
window.recaptchaVerifier
);


document.getElementById("msg").innerHTML =
"✅ OTP পাঠানো হয়েছে";


}catch(error){

document.getElementById("msg").innerHTML =
"❌ "+error.message;

}

}

// Verify OTP & Register

window.verifyOTP = async function(){

const otp =
document.getElementById("otp").value.trim();

const referral =
document.getElementById("referral").value.trim();


if(!otp){

document.getElementById("msg").innerHTML =
"❌ OTP দিন";

return;

}


try{


const result = await confirmationResult.confirm(otp);


const user = result.user;


const referralCode =
"RF"+Math.random().toString(36).substring(2,8).toUpperCase();



await setDoc(doc(db,"users",user.uid),{

uid:user.uid,

phone:user.phoneNumber,

balance:0,

code:referralCode,

referredBy:referral,

referralCount:0,

referralIncome:0,

createdAt:Date.now()

});



document.getElementById("msg").innerHTML =
"✅ Registration Successful";


localStorage.setItem(
"userPhone",
user.phoneNumber
);


setTimeout(()=>{

window.location.href="home.html";

},1500);



}catch(error){


document.getElementById("msg").innerHTML =
"❌ OTP ভুল হয়েছে";


}

  
</script>
</body>
</html>
