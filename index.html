<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakib Freelancer</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#007bff,#00c6ff);
color:#fff;
text-align:center;
}

h1{
font-size:40px;
margin-bottom:10px;
}

p{
font-size:20px;
opacity:.9;
}

.loader{
margin:25px auto;
width:50px;
height:50px;
border:5px solid rgba(255,255,255,.3);
border-top:5px solid #fff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div>
<h1>Rakib Freelancer</h1>
<p>Loading...</p>
<div class="loader"></div>
</div>

<script>
setTimeout(function(){
    window.location.href = "home.html";
},1000);
</script>

</body>
</html>
