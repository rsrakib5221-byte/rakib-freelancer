<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakib Freelancer - Login & Register</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}
.box{
background:#fff;
padding:25px;
border-radius:10px;
width:330px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{text-align:center;}
input{
width:100%;
padding:10px;
margin:8px 0;
box-sizing:border-box;
}
button{
width:100%;
padding:10px;
background:#1877f2;
color:#fff;
border:none;
cursor:pointer;
margin-top:10px;
}
button:hover{
background:#145dbf;
}
#msg{
margin-top:10px;
text-align:center;
color:green;
}
</style>
<meta name="monetag" content="bdece45ac4f24da9f60adbf3dacd686e"></head>

<body>

<div class="box">
<h2>Rakib Freelancer</h2>
  <input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendEmailVerification,
signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyAaQIX6yMxjf6bkHD6HPSImNF3o7r0fZvo",
authDomain: "rakib-freelancer.firebaseapp.com",
projectId: "rakib-freelancer",
storageBucket: "rakib-freelancer.firebasestorage.app",
messagingSenderId: "172744042815",
appId: "1:172744042815:web:2b77927b0ecacf59d00b8a",
measurementId: "G-FKFC3JM9XR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = async function () {

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value.trim();

try {

const userCredential = await createUserWithEmailAndPassword(auth, email, password);

await sendEmailVerification(userCredential.user);

await signOut(auth);

document.getElementById("msg").innerHTML =
"✅ Registration Successful.<br>📧 Verification Email পাঠানো হয়েছে। আগে Email Verify করুন।";

} catch (error) {

document.getElementById("msg").innerHTML =
"❌ " + error.message;

}

}

  window.login = async function () {

const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value.trim();

try {

const userCredential = await signInWithEmailAndPassword(auth, email, password);

await userCredential.user.reload();

if (!userCredential.user.emailVerified) {

await signOut(auth);

document.getElementById("msg").innerHTML =
"❌ আগে আপনার Email Verify করুন।";

return;

}

document.getElementById("msg").innerHTML =
"✅ Login Successful";

window.location.href = "home.html";

} catch (error) {

document.getElementById("msg").innerHTML =
"❌ " + error.message;

}

  }
  
</script>
</body>
</html>
