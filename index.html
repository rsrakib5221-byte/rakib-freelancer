<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakib Freelancer - Login</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#007bff,#00c6ff);
}
.box{
background:#fff;
width:350px;
padding:30px;
border-radius:20px;
text-align:center;
}
h1{
color:#007bff;
margin-bottom:20px;
}
input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#007bff;
color:#fff;
font-size:16px;
cursor:pointer;
}
a{
display:block;
margin-top:15px;
color:#007bff;
cursor:pointer;
text-decoration:none;
}
</style>
</head>

<body>

<div class="box">

<h1>Rakib Freelancer</h1>

<input type="text" id="name" placeholder="Full Name">

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button id="register">Register</button>

<button id="login">Login</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAaQIX6yMxjf6bkHD6HPSImNF3o7r0fZvo",
authDomain:"rakib-freelancer.firebaseapp.com",
projectId:"rakib-freelancer",
storageBucket:"rakib-freelancer.firebasestorage.app",
messagingSenderId:"172744042815",
appId:"1:172744042815:web:2b77927b0ecacf59d00b8a"
};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

register.onclick=async()=>{

const name=document.getElementById("name").value;

const email=document.getElementById("email").value;

const password=document.getElementById("password").value;

try{

const user=await createUserWithEmailAndPassword(auth,email,password);

await setDoc(doc(db,"users",user.user.uid),{

name:name,

email:email,

balance:0

});

alert("Register Successful");

location.href="home.html";

}catch(e){

alert(e.message);

}

};

login.onclick=async()=>{

const email=document.getElementById("email").value;

const password=document.getElementById("password").value;

try{

await signInWithEmailAndPassword(auth,email,password);

location.href="home.html";

}catch(e){

alert(e.message);

}

};

</script>

</body>
</html>
