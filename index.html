<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rakib Freelancer - Login & Register</title>

<style>
  body{
    background:linear-gradient(135deg,#1877f2,#00c6ff);
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.register-box{
    width:350px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}

.register-box h2{
    color:#1877f2;
    font-size:28px;
    margin-bottom:5px;
}

.register-box p{
    color:#777;
}


.register-box input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    box-sizing:border-box;
    outline:none;
}


.register-box input:focus{
    border-color:#1877f2;
}


.register-box button{

    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:16px;
    cursor:pointer;

}


.register-box button:hover{

    background:#145dbf;

}


#recaptcha-container{

    margin:10px 0;

}


#msg{

    margin-top:15px;
    font-weight:bold;

}

</style>

<div class="register-box">

<h2>Rakib Freelancer</h2>

<p>Create New Account</p>

<input
type="text"
id="name"
placeholder="👤 Full Name"
  >
<input
type="tel"
id="phone"
placeholder="📱 Phone Number"
>
<input
type="email"
id="email"
placeholder="📧 Email"
>

<input
type="password"
id="password"
placeholder="🔒 Password"
>

<input
type="text"
id="referral"
placeholder="🎁 Referral Code"
>

<button onclick="register()">
Register
</button>

<button onclick="login()">
Login
</button>

<p id="msg"></p>
  <div id="recaptcha-container"></div>

<button onclick="sendOTP()">
📩 Send OTP
</button>

<input
type="text"
id="otp"
placeholder="🔐 Enter OTP">

<button onclick="verifyOTP()">
✅ Verify OTP
</button>

<script type="module">
  import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signInWithPhoneNumber,
  RecaptchaVerifier
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
const firebaseConfig = {
apiKey: "AIzaSyAaQIX6yMxjf6bkHD6HPSImNF3o7r0fZvo",
authDomain: "rakib-freelancer.firebaseapp.com",
projectId: "rakib-freelancer",
storageBucket: "rakib-freelancer.firebasestorage.app",
messagingSenderId: "172744042815",
appId: "1:172744042815:web:2b77927b0ecacf59d00b8a",
measurementId: "G-FKFC3JM9XR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
  let confirmationResult = null;

window.recaptchaVerifier = new RecaptchaVerifier(
  auth,
  "recaptcha-container",
  {
    size: "normal"
  }
);
  async function sendOTP() {
  const phone = document.getElementById("phone").value.trim();

  if (!phone) {
    document.getElementById("msg").innerHTML = "❌ ফোন নম্বর লিখুন";
    return;
  }

  try {
    confirmationResult = await signInWithPhoneNumber(
      auth,
      "+88" + phone,
      window.recaptchaVerifier
    );

    document.getElementById("msg").innerHTML = "✅ OTP পাঠানো হয়েছে";
  } catch (error) {
    document.getElementById("msg").innerHTML = "❌ " + error.message;
  }
  }
async function register() {

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const referral = document.getElementById("referral").value.trim();

  if (!name || !email || !password) {
    document.getElementById("msg").innerHTML = "❌ সব তথ্য পূরণ করুন";
    return;
  }

  try {
const userCredential = await createUserWithEmailAndPassword(
  auth,
  email,
  password
);

await setDoc(doc(db, "users", userCredential.user.uid), {
  name: name,
  email: email,
phone: document.getElementById("phone").value.trim(),
referral: referral,
createdAt: new Date()
});

document.getElementById("msg").innerHTML = "✅ রেজিস্ট্রেশন সফল হয়েছে!";
window.location.href = "login.html";

} catch (error) {
  document.getElementById("msg").innerHTML = "❌ " + error.message;
}
}
  async function verifyOTP() {
  const otp = document.getElementById("otp").value.trim();

  if (!confirmationResult) {
    document.getElementById("msg").innerHTML = "❌ আগে OTP পাঠান";
    return;
  }

  try {
    await confirmationResult.confirm(otp);
    document.getElementById("msg").innerHTML = "✅ ফোন নম্বর ভেরিফাই হয়েছে";
  } catch (error) {
    document.getElementById("msg").innerHTML = "❌ ভুল OTP";
  }
  }

  </script>
</body>
</html>
