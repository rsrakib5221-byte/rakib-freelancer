<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.box{
background:#fff;
padding:30px;
border-radius:10px;
text-align:center;
box-shadow:0 0 10px rgba(0,0,0,.2);
width:320px;
}
button{
padding:12px 20px;
border:none;
background:#1877f2;
color:#fff;
border-radius:5px;
cursor:pointer;
font-size:16px;
}
</style>

</head>
<body>

<div class="box">
<h1>Welcome</h1>
<p>Login Successful ✅</p>

<h3 id="userEmail"></h3>

<button id="logout">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
getAuth,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAaQIX6yMxjf6bkHD6HPSImNF3o7r0fZvo",
  authDomain: "rakib-freelancer.firebaseapp.com",
  projectId: "rakib-freelancer",
  storageBucket: "rakib-freelancer.firebasestorage.app",
  messagingSenderId: "172744042815",
  appId: "1:172744042815:web:2b77927b0ecacf59d00b8a",
  measurementId: "G-FKFC3JM9XR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth,(user)=>{
if(user){
document.getElementById("userEmail").innerHTML=user.email;
}else{
window.location.href="index.html";
}
});

document.getElementById("logout").onclick=()=>{
signOut(auth).then(()=>{
window.location.href="index.html";
});
};
</script>

</body>
</html>
