<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
}
.box{
background:#fff;
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
}
input,select,button{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}
button{
background:#f7c500;
border:none;
cursor:pointer;
}
</style>
</head>
<body>

<div class="box">
<h2>Withdraw</h2>

<input type="number" id="amount" placeholder="Enter Amount">

<select id="method">
<option>bKash</option>
<option>Nagad</option>
<option>Rocket</option>
</select>

<input type="text" id="number" placeholder="Account Number">

<button onclick="submitWithdraw()">Submit</button>
</div>

<script>
function submitWithdraw() {
    alert("New Code Running");
    const amount = Number(document.getElementById("amount").value);
    const method = document.getElementById("method").value;
    const number = document.getElementById("number").value.trim();

    if (amount < 100) {
        alert("❌ সর্বনিম্ন 100 টাকা Withdraw করা যাবে।");
        return;
    }

    if (number === "") {
        alert("❌ আপনার " + method + " নম্বর লিখুন।");
        return;
    }

    alert("Amount = " + amount);
}
</script>

</body>
</html>
