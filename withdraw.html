<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
}
.box{
background:#fff;
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
}
input,select,button{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}
button{
background:#f7c500;
border:none;
cursor:pointer;
}
</style>
</head>
<body>

<div class="box">
<h2>Withdraw</h2>

<input type="number" id="amount" placeholder="Enter Amount">

<select id="method">
<option>bKash</option>
<option>Nagad</option>
<option>Rocket</option>
</select>

<input type="text" id="number" placeholder="Account Number">

<button onclick="submitWithdraw()">Submit</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDoc, doc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyAaQIX6yMxjf6bkHD6HPSImNF3o7r0fZvo",
  authDomain: "rakib-freelancer.firebaseapp.com",
  projectId: "rakib-freelancer",
  storageBucket: "rakib-freelancer.firebasestorage.app",
  messagingSenderId: "172744042815",
  appId: "1:172744042815:web:2b77927b0ecacf59d00b8a",
  measurementId: "G-FKFC3JM9XR"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
window.submitWithdraw = async function () {
    const amount = Number(document.getElementById("amount").value);
    const method = document.getElementById("method").value;
    const number = document.getElementById("number").value.trim();

    if (amount < 100) {
        showPopup("❌ সর্বনিম্ন 100 টাকা Withdraw করা যাবে");
        return;
    }

    if (number === "") {
        showPopup("✅ Withdraw Request Submitted");
        return;
    }
const user = auth.currentUser;

if (!user) {
    showPopup("Please login first");
    return;
}

try {
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);

    const balance = Number(userSnap.data()?.balance || 0);

    if (balance < amount) {
        showPopup("❌ Insufficient Balance");
        return;
    }

    await addDoc(collection(db, "withdraws"), {
        email: auth.currentUser?.email || "",
        amount: amount,
        method: method,
        number: number,
        status: "Pending",
        createdAt: new Date()
    });

    showPopup("✅ Withdraw Request Submitted");

} catch (e) {
    showPopup("❌ Error: " + e.message);
}
};
  function showPopup(message) {
  document.getElementById("popupMessage").innerText = message;
  document.getElementById("popup").style.display = "flex";
}

window.closePopup = function () {
    document.getElementById("popup").style.display = "none";
};
}
</script>

<div id="popup" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center;">
  <div style="background:#fff;padding:20px;border-radius:12px;width:300px;text-align:center;">
    <h3>Rakib Freelancer</h3>
    <p id="popupMessage"></p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

</body>
</html>
