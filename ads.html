<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Watch Ads</title>

<style>
body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
padding:20px;
}

.box{
background:#fff;
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
}

button{
background:#ffc107;
border:none;
padding:12px 25px;
border-radius:8px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>Watch Ads & Earn</h2>

<p>Reward: ৳1</p>

<button onclick="watchAd()">Watch Ad</button>

<p id="msg"></p>

</div>

<script>
function watchAd(){
document.getElementById("msg").innerHTML="✅ Ad Completed. Reward Added!";
}
</script>

</body>
</html>
