<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
}

header{
background:#f7c500;
color:#fff;
padding:18px;
font-size:22px;
font-weight:bold;
display:flex;
align-items:center;
}

header a{
color:#fff;
text-decoration:none;
margin-right:15px;
font-size:24px;
}

.profile{
text-align:center;
padding:30px;
}

.profile img{
width:120px;
height:120px;
border-radius:50%;
border:4px solid #f7c500;
}

.profile h2{
margin:15px 0 5px;
}

.profile p{
color:#666;
}

.menu{
margin:20px;
background:#fff;
border-radius:15px;
overflow:hidden;
}

.menu a{
display:block;
padding:18px;
text-decoration:none;
color:#333;
border-bottom:1px solid #eee;
font-size:18px;
}
</style>
</head>

<body>

<header>
<a href="home.html"><i class="fas fa-arrow-left"></i></a>
Profile
</header>

<div class="profile">
<img id="profileImage" src="https://via.placeholder.com/120">
<h2>Rakib Freelancer</h2>
<p id="userEmail">user@email.com</p>
<p>Referral Code: <span id="refCode">Loading...</span></p>
</div>

<div class="menu">
<h3 style="padding:15px;">💸 Last Withdraw</h3>

<p style="padding:0 15px;">
Amount: <span id="wAmount">-</span>
</p>

<p style="padding:0 15px;">
Method: <span id="wMethod">-</span>
</p>

<p style="padding:0 15px;">
Status: <span id="wStatus">No Request</span>
</p>
</div>
<div class="menu">
<a href="javascript:void(0)" onclick="editProfile(); return false;">👤 Edit Profile</a>
<a href="withdraw.html">💸 Withdraw</a>
<a href="#">📱 bKash</a>
<a href="#">💰 Nagad</a>
<a href="#">🚀 Rocket</a>
<a href="#">🚪 Logout</a>
</div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAaQIX6yMxjf6bkHD6HPSImNF3o7r0fZvo",
  authDomain: "rakib-freelancer.firebaseapp.com",
  projectId: "rakib-freelancer",
  storageBucket: "rakib-freelancer.firebasestorage.app",
  messagingSenderId: "172744042815",
  appId: "1:172744042815:web:2b77927b0ecacf59d00b8a",
  measurementId: "G-FKFC3JM9XR"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
    window.editProfile = function () {
    alert("Edit Profile Clicked");

    let name = prompt("Enter your name:", localStorage.getItem("userName") || "Rakib Freelancer");
    if (name === null) return;

    let email = prompt("Enter your email:", localStorage.getItem("userEmail") || "user@email.com");
    if (email === null) return;

    localStorage.setItem("userName", name);
    localStorage.setItem("userEmail", email);

    document.querySelector("h2").innerText = name;
    document.getElementById("userEmail").innerText = email;

    alert("Profile Updated!");
}
window.onload = async function () {
    const img = localStorage.getItem("profileImage");
    if (img) document.getElementById("profileImage").src = img;

    const name = localStorage.getItem("userName");
    if (name) document.querySelector("h2").innerText = name;

    const email = localStorage.getItem("userEmail");
    if (email) document.getElementById("userEmail").innerText = email;

    // 👇 এইখানে (লাইন ১৫৪-এর আগে) কোড বসাবেন
onAuthStateChanged(auth, (user) => {
    if (!user) return;
    document.getElementById("userEmail").innerText = user.email;
document.querySelector("h2").innerText = user.displayName || "Rakib Freelancer";
document.getElementById("refCode").innerText = "Connected";
const userQuery = query(
  collection(db, "users"),
  where("email", "==", user.email)
);
    console.log("Login Email:", user.email);
getDocs(userQuery)
.then((snap) => {
    console.log("Documents Found:", snap.size);
    if (!snap.empty) {
        document.getElementById("refCode").innerText =
            snap.docs[0].data().code;
    } else {
        document.getElementById("refCode").innerText = "Not Found";
    }
})
.catch((error) => {
    console.error(error);
    document.getElementById("refCode").innerText = "Network Error";
});
    const q = query(
        collection(db, "withdraws"),
        where("email", "==", user.email)
    );

    onSnapshot(q, (snapshot) => {
        if (!snapshot.empty) {
            const d = snapshot.docs[snapshot.docs.length - 1].data();

            document.getElementById("wAmount").innerText = d.amount;
            document.getElementById("wMethod").innerText = d.method;
            document.getElementById("wStatus").innerText = d.status;
        }
    });
});
};
    
</script>

</body>
</html>
