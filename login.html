<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Rakib Freelancer</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#1877f2,#6a11cb);
padding:20px;
}


.container{
width:100%;
max-width:400px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
text-align:center;
color:#fff;
}


.container h2{
font-size:30px;
margin-bottom:10px;
}


.container p{
margin-bottom:20px;
}


input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:16px;
outline:none;
}


button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#fff;
color:#1877f2;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}


button:hover{
transform:scale(1.03);
}


a{
color:#fff;
font-weight:bold;
text-decoration:none;
}


#msg{
margin-top:15px;
font-weight:bold;
}


</style>

</head>


<body>


<div class="container">

<h2>Welcome Back</h2>

<p>Login Rakib Freelancer</p>


<input type="email" id="email" placeholder="📧 Email Address">


<input type="password" id="password" placeholder="🔒 Password">


<button onclick="login()">
Login
</button>


<p id="msg"></p>


<p>
Don't have an account?
<a href="register.html">Register</a>
</p>


</div>



<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



const firebaseConfig = {

apiKey:"AIzaSyAaQIX6yMxjf6bkHD6HPSImNF3o7r0fZvo",

authDomain:"rakib-freelancer.firebaseapp.com",

projectId:"rakib-freelancer",

storageBucket:"rakib-freelancer.firebasestorage.app",

messagingSenderId:"172744042815",

appId:"1:172744042815:web:2b77927b0ecacf59d00b8a"

};



const app = initializeApp(firebaseConfig);

const auth = getAuth(app);



async function login(){


const email = document.getElementById("email").value.trim();

const password = document.getElementById("password").value;



if(!email || !password){

document.getElementById("msg").innerHTML =
"❌ সব তথ্য পূরণ করুন";

return;

}



try{


await signInWithEmailAndPassword(
auth,
email,
password
);



document.getElementById("msg").innerHTML =
"✅ Login Successful!";



setTimeout(()=>{

window.location.href="index.html";

},1500);



}

catch(error){


document.getElementById("msg").innerHTML =
"❌ "+error.message;


}


}


window.login = login;


</script>


</body>
</html>
