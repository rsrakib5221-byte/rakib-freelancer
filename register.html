<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Rakib Freelancer</title>
  <style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#1877f2,#6a11cb);
padding:20px;
}

.container{
width:100%;
max-width:400px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.25);
text-align:center;
color:#fff;
}

.container h2{
font-size:30px;
margin-bottom:8px;
}

.container p{
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#fff;
color:#1877f2;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
}

a{
color:#fff;
font-weight:bold;
text-decoration:none;
}

#msg{
margin-top:15px;
font-weight:bold;
}
  </style>
</head>

<body>

<div class="container">

<h2>Create Account</h2>
<p>Join Rakib Freelancer</p>

<input type="text" id="name" placeholder="👤 Full Name">

<input type="email" id="email" placeholder="📧 Email Address">

<input type="password" id="password" placeholder="🔒 Password">

<input type="password" id="confirm" placeholder="🔒 Confirm Password">

<button onclick="register()">
Create Account
</button>

<p id="msg"></p>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</body>
</html>
